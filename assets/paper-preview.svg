<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-label="Heurisma working-paper HTML preview showing Abstract, inline SVG figure, and Claim-Evidence Matrix">
  <defs>
