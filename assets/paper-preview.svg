    <!-- Left column: Working-paper header, Abstract & Claim-Evidence Matrix -->
    <g transform="translate(46, 70)">
      <text x="0" y="18" font-family="Georgia, Charter, serif" font-size="17" font-weight="700" fill="#111827">Hybrid Work (2 Days Remote) vs. Full-Time Office</text>
      <text x="0" y="39" font-family="Georgia, Charter, serif" font-size="17" font-weight="700" fill="#111827">in Software Engineering</text>
      <text x="0" y="59" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#64748b">As-Of Date: 2026-11-20  |  Depth Level: Level 2  |  Economics &amp; Software Engineering</text>
      <line x1="0" y1="70" x2="468" y2="70" stroke="#1e293b" stroke-width="1.5"/>

