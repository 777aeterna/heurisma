      <rect x="0" y="84" width="468" height="148" fill="#f8fafc"/>
      <rect x="0" y="84" width="3.5" height="148" fill="#0072B2"/>
      <text x="14" y="103" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.08em" fill="#0072B2">ABSTRACT · CALIBRATED VERDICT</text>
      <text x="14" y="123" font-family="Georgia, Charter, serif" font-size="12" fill="#111827">In the supplied 16-site dataset (origin undocumented), 2-day hybrid</text>
      <text x="14" y="140" font-family="Georgia, Charter, serif" font-size="12" fill="#111827">work is associated with lower attrition (-4.01 pp, exact p = 0.0004)</text>
      <text x="14" y="157" font-family="Georgia, Charter, serif" font-size="12" fill="#111827">and a -9.00 pp junior-vs-senior PR output divergence [1]
        <tspan font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#92400e"> [Preliminary]</tspan>.
      </text>
      <text x="14" y="180" font-family="Georgia, Charter, serif" font-size="11.5" fill="#334155">External randomized evidence confirms a 33% quit-rate reduction</text>
      <text x="14" y="196" font-family="Georgia, Charter, serif" font-size="11.5" fill="#334155">with null average productivity effect [2]
        <tspan font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#075985"> [Moderate]</tspan>.
      </text>
      <text x="14" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="9.8" fill="#64748b">Every figure traced via {num:key} → appendix/numbers.json &amp; output.txt</text>

