      <svg x="8" y="66" width="492" height="228" viewBox="0 0 680 304">
        <title>PR Output Change by Seniority and Work Policy (16 Sites)</title><desc>Site-level means. With 4 sites per cell the difference is exactly testable but small-sample; see Section 4.2.</desc><g data-bar-layout="vertical"></g><line x1="68" y1="268.0" x2="656" y2="268.0" stroke="#e2e8f0" stroke-width="1"/><text x="60" y="271.5" text-anchor="end" font-size="11" fill="#475569">-6%</text><line x1="68" y1="222.0" x2="656" y2="222.0" stroke="#e2e8f0" stroke-width="1"/><text x="60" y="225.5" text-anchor="end" font-size="11" fill="#475569">-4%</text><line x1="68" y1="176.0" x2="656" y2="176.0" stroke="#e2e8f0" stroke-width="1"/><text x="60" y="179.5" text-anchor="end" font-size="11" fill="#475569">-2%</text><line x1="68" y1="130.0" x2="656" y2="130.0" stroke="#e2e8f0" stroke-width="1"/><text x="60" y="133.5" text-anchor="end" font-size="11" fill="#475569">0%</text><line x1="68" y1="84.0" x2="656" y2="84.0" stroke="#e2e8f0" stroke-width="1"/><text x="60" y="87.5" text-anchor="end" font-size="11" fill="#475569">2%</text><line x1="68" y1="38.0" x2="656" y2="38.0" stroke="#e2e8f0" stroke-width="1"/><text x="60" y="41.5" text-anchor="end" font-size="11" fill="#475569">4%</text><line x1="68" y1="268" x2="656" y2="268" stroke="#334155" stroke-width="1.2"/><text x="68" y="28" text-anchor="start" font-size="11" font-weight="600" fill="#334155">PRs Merged Delta</text><line x1="68" y1="130.0" x2="656" y2="130.0" stroke="#334155" stroke-width="1.2"/><rect class="bar" data-value="-0.0074" x="108.5" y="130.0" width="56.0" height="17.0" rx="2" fill="#0072B2"/><text x="136.5" y="159.0" text-anchor="middle" font-size="10" fill="#1e293b">-0.7%</text><rect class="bar" data-value="0.0104" x="167.5" y="106.1" width="56.0" height="23.9" rx="2" fill="#D55E00"/><text x="195.5" y="101.1" text-anchor="middle" font-size="10" fill="#1e293b">1.0%</text><text class="cat-label" data-group="0" x="166.0" y="286" text-anchor="middle" font-size="11" fill="#334155">Pooled (16 sites)</text><rect class="bar" data-value="0.0297" x="304.5" y="61.7" width="56.0" height="68.3" rx="2" fill="#0072B2"/><text x="332.5" y="56.7" text-anchor="middle" font-size="10" fill="#1e293b">3.0%</text><rect class="bar" data-value="0.0025" x="363.5" y="124.2" width="56.0" height="5.8" rx="2" fill="#D55E00"/><text x="391.5" y="119.2" text-anchor="middle" font-size="10" fill="#1e293b">0.2%</text><text class="cat-label" data-group="1" x="362.0" y="286" text-anchor="middle" font-size="11" fill="#334155">Senior (8 sites)</text><rect class="bar" data-value="-0.0445" x="500.5" y="130.0" width="56.0" height="102.3" rx="2" fill="#0072B2"/><text x="528.5" y="244.3" text-anchor="middle" font-size="10" fill="#1e293b">-4.5%</text><rect class="bar" data-value="0.0182" x="559.5" y="88.1" width="56.0" height="41.9" rx="2" fill="#D55E00"/><text x="587.5" y="83.1" text-anchor="middle" font-size="10" fill="#1e293b">1.8%</text><text class="cat-label" data-group="2" x="558.0" y="286" text-anchor="middle" font-size="11" fill="#334155">Junior (8 sites)</text><rect x="562.5" y="7" width="11" height="11" rx="2" fill="#D55E00"/><text x="577.5" y="16" font-size="10.5" fill="#1e293b">Office (5d)</text><rect x="443.0" y="7" width="11" height="11" rx="2" fill="#0072B2"/><text x="458.0" y="16" font-size="10.5" fill="#1e293b">Hybrid (2d WFH)</text>
