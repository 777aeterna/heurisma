# Development-only tool configuration (linting and type-checking in CI).
# The heurisma skill itself has ZERO external runtime dependencies (Python >= 3.9 stdlib only).

[tool.ruff]
target-version = "py39"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402", "E501", "E701", "E702", "E741", "I001"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false
warn_unused_configs = true
