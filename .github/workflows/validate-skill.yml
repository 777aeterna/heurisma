name: Validate Heurisma Skill

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate SKILL.md YAML frontmatter and discovery rules
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          skill_path = Path("skills/heurisma/SKILL.md")
          text = skill_path.read_text(encoding="utf-8")
          assert text.startswith("---\n"), "SKILL.md must start with YAML frontmatter"
          fm = text.split("---\n", 2)[1]
          fields = dict(line.split(": ", 1) for line in fm.strip().splitlines() if ": " in line)
          assert fields.get("name") == "heurisma", f"Unexpected skill name: {fields.get('name')}"
          desc = fields.get("description", "")
          assert desc.startswith("Use when"), f"Description must start with 'Use when': {desc}"
          assert len(fm) <= 1024, f"Frontmatter exceeds 1024 chars ({len(fm)})"
          print(f"Frontmatter OK (name=heurisma, len={len(fm)} chars)")
          EOF

      - name: Verify cross-runtime relative links inside skills/heurisma/
        run: |
          python3 - <<'EOF'
          import re
          from pathlib import Path
          skill_root = Path("skills/heurisma")
          link_re = re.compile(r"\[[^\]]+\]\(([^)]+)\)")
          broken = []
          for md_file in skill_root.rglob("*.md"):
              text = md_file.read_text(encoding="utf-8")
              for target in link_re.findall(text):
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  clean_target = target.split("#", 1)[0]
                  resolved = (md_file.parent / clean_target).resolve()
                  if not resolved.exists():
                      broken.append(f"{md_file}: broken link -> {target}")
          assert not broken, "Broken relative links found:\n" + "\n".join(broken)
          print("All relative links inside skills/heurisma/ resolved cleanly.")
          EOF

      - name: Run report validator unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Run Level 2 showcase analysis script
        run: python3 examples/scripts/analyze_example.py

      - name: Validate all showcase example reports
        run: |
          python3 skills/heurisma/scripts/validate_report.py examples/level1-brief-example.md
          python3 skills/heurisma/scripts/validate_report.py examples/level2-data-study-example.md
