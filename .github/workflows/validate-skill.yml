name: Validate Heurisma Skill

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate SKILL.md frontmatter, portability, and relative links
        run: |
          python3 -B - <<'EOF'
          import re
          from pathlib import Path

          skill_root = Path("skills/heurisma")
          skill_md = (skill_root / "SKILL.md").read_text(encoding="utf-8")
          assert skill_md.startswith("---\n"), "SKILL.md must start with YAML frontmatter"
          fm = skill_md.split("---\n", 2)[1]
          fields = dict(line.split(": ", 1) for line in fm.strip().splitlines() if ": " in line)
          assert fields.get("name") == "heurisma", f"Unexpected skill name: {fields.get('name')}"
          desc = fields.get("description", "")
          assert desc.startswith("Use when"), f"Description must start with 'Use when': {desc}"
          assert len(fm) <= 1024, f"Frontmatter exceeds 1024 chars ({len(fm)})"

          forbidden = ("search_web", "TypeName", "skills/heurisma/scripts")
          link_re = re.compile(r"\[[^\]]+\]\(([^)]+)\)")
          for md_file in skill_root.rglob("*.md"):
              text = md_file.read_text(encoding="utf-8")
              for bad in forbidden:
                  assert bad not in text, f"Runtime-locked string '{bad}' found in {md_file}"
              clean_text = re.sub(r"^```.*?^```[ \t]*$", "", text, flags=re.MULTILINE | re.DOTALL)
              for target in link_re.findall(clean_text):
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  resolved = (md_file.parent / target.split("#", 1)[0]).resolve()
                  assert resolved.exists(), f"{md_file}: broken link -> {target}"
          print(f"Frontmatter, portability & links OK (len={len(fm)} chars)")
          EOF

      - name: Run local-data, SVG engine, renderer, and validator unit tests
        run: python3 -B -m unittest discover -s tests -v

      - name: Check Claude Code agent definitions mirror the portable prompts
        run: python3 -B -m unittest tests.test_agents_sync -v

      - name: Smoke-test local_data.py inventory
        run: python3 -B skills/heurisma/scripts/local_data.py inventory examples/level2-study/appendix

      - name: Run Level 2 showcase analysis, render working-paper HTML, and validate deliverables
        run: |
          python3 -B examples/level2-study/appendix/analysis.py \
            --charts-out examples/level2-study/charts.json \
            --numbers-out examples/level2-study/appendix/numbers.json \
            > examples/level2-study/appendix/output.txt
          python3 -B skills/heurisma/scripts/render_report.py examples/level2-study/report.md \
            --out examples/level2-study/report.html \
            --charts examples/level2-study/charts.json \
            --appendix examples/level2-study/appendix
          python3 -B skills/heurisma/scripts/validate_report.py examples/level1-brief-example.md --level 1
          python3 -B skills/heurisma/scripts/validate_report.py examples/level2-study/report.md \
            --level 2 --html examples/level2-study/report.html --strict
          python3 -B examples/showcase-hybrid-work/appendix/analysis.py \
            --charts-out examples/showcase-hybrid-work/charts.json \
            --numbers-out examples/showcase-hybrid-work/appendix/numbers.json \
            > examples/showcase-hybrid-work/appendix/output.txt
          python3 -B skills/heurisma/scripts/render_report.py examples/showcase-hybrid-work/report.md \
            --out examples/showcase-hybrid-work/report.html \
            --charts examples/showcase-hybrid-work/charts.json \
            --appendix examples/showcase-hybrid-work/appendix
          python3 -B skills/heurisma/scripts/validate_report.py examples/showcase-hybrid-work/report.md \
            --level 2 --html examples/showcase-hybrid-work/report.html --strict

      - name: Offline rehearsal of the local-data rung and privacy check
        run: |
          rm -rf /tmp/offline-run && mkdir -p /tmp/offline-run/datos
          printf 'fecha;valor\n2026-01-01;1459,42\n' > /tmp/offline-run/datos/serie.csv
          HEURISMA_OFFLINE=1 python3 -B skills/heurisma/scripts/local_data.py import /tmp/offline-run/datos/serie.csv \
            --into /tmp/offline-run/appendix/data --sources /tmp/offline-run/appendix/sources.csv \
            --tier "Tier 2" --title "Serie local" --lang es
          grep -q "local:appendix/data/serie.csv" /tmp/offline-run/appendix/data_attempts.csv
          if grep -rn "/home/" examples/*/report.html; then echo "absolute path leaked into HTML"; exit 1; fi
          if grep -q "file://" /tmp/offline-run/appendix/sources.csv; then echo "relative local path stored as file:// URI"; exit 1; fi
          grep -q "attempted_utc" /tmp/offline-run/appendix/data_attempts.csv

      - name: Validator works in isolated mode and requires gate traces
        run: |
          for d in level2-study showcase-hybrid-work; do
            python3 -I -B skills/heurisma/scripts/validate_report.py examples/$d/report.md \
              --level 2 --html examples/$d/report.html --strict
          done
          rm -rf /tmp/gate-check && cp -r examples/level2-study /tmp/gate-check && rm /tmp/gate-check/appendix/gates/qa.md
          if python3 -B skills/heurisma/scripts/validate_report.py /tmp/gate-check/report.md --level 2 --strict; then
            echo "missing appendix/gates/qa.md was not reported"; exit 1
          fi
