name: Validate Heurisma Skill

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12", "3.13"]
        exclude:
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate SKILL.md frontmatter, portability, and relative links
        run: |
          python -B - <<'EOF'
          import re
          from pathlib import Path

          skill_root = Path("skills/heurisma")
          skill_md = (skill_root / "SKILL.md").read_text(encoding="utf-8")
          assert skill_md.startswith("---\n"), "SKILL.md must start with YAML frontmatter"
          fm = skill_md.split("---\n", 2)[1]
          fields = dict(line.split(": ", 1) for line in fm.strip().splitlines() if ": " in line)
          assert fields.get("name") == "heurisma", f"Unexpected skill name: {fields.get('name')}"
          desc = fields.get("description", "")
          assert desc.startswith("Use when"), f"Description must start with 'Use when': {desc}"
          assert "3.9" in fields.get("compatibility", ""), f"Missing Python 3.9 compatibility: {fields.get('compatibility')}"
          assert len(fm) <= 1024, f"Frontmatter exceeds 1024 chars ({len(fm)})"

          forbidden = ("search_web", "TypeName", "skills/heurisma/scripts")
          link_re = re.compile(r"\[[^\]]+\]\(([^)]+)\)")
          for md_file in skill_root.rglob("*.md"):
              text = md_file.read_text(encoding="utf-8")
              for bad in forbidden:
                  assert bad not in text, f"Runtime-locked string '{bad}' found in {md_file}"
              clean_text = re.sub(r"^```.*?^```[ \t]*$", "", text, flags=re.MULTILINE | re.DOTALL)
              for target in link_re.findall(clean_text):
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  resolved = (md_file.parent / target.split("#", 1)[0]).resolve()
                  assert resolved.exists(), f"{md_file}: broken link -> {target}"
          print(f"Frontmatter, portability & links OK (len={len(fm)} chars)")
          EOF

      - name: Run full unit test suite
        run: python -B -m unittest discover -s tests -v

      - name: Check mutation detection rate (100% required)
        run: python -B tests/mutation_report.py --min-rate 1.0

      - name: Smoke-test local_data.py inventory and validator --json
        run: |
          python -B skills/heurisma/scripts/local_data.py inventory examples/level2-study/appendix
          python -B skills/heurisma/scripts/validate_report.py examples/level2-study/report.md \
            --level 2 --html examples/level2-study/report.html --strict --json | python -B -c \
            'import json, sys; d = json.load(sys.stdin); assert d["passed"] is True, d; print("JSON smoke OK:", d["version"])'

      - name: Validate examples with --strict and --reproduce
        run: |
          python -B skills/heurisma/scripts/validate_report.py examples/level1-brief-example.md --level 1
          for d in level2-study showcase-hybrid-work; do
            python -B skills/heurisma/scripts/validate_report.py examples/$d/report.md \
              --level 2 --html examples/$d/report.html --strict --reproduce
          done

      - name: Offline rehearsal of the local-data rung and privacy check
        run: |
          WORK="${RUNNER_TEMP:-/tmp}/offline-run"
          rm -rf "$WORK" && mkdir -p "$WORK/datos"
          printf 'fecha;valor\n2026-01-01;1459,42\n' > "$WORK/datos/serie.csv"
          HEURISMA_OFFLINE=1 python -B skills/heurisma/scripts/local_data.py import "$WORK/datos/serie.csv" \
            --into "$WORK/appendix/data" --sources "$WORK/appendix/sources.csv" \
            --tier "Tier 2" --title "Serie local" --lang es
          grep -q "local:appendix/data/serie.csv" "$WORK/appendix/data_attempts.csv"
          if grep -rn "/home/" examples/*/report.html; then echo "absolute path leaked into HTML"; exit 1; fi
          if grep -q "file://" "$WORK/appendix/sources.csv"; then echo "relative local path stored as file:// URI"; exit 1; fi
          grep -q "attempted_utc" "$WORK/appendix/data_attempts.csv"
          python -B skills/heurisma/scripts/local_data.py attempt --csv "$WORK/appendix/data_attempts.csv" \
            --target "Serie X" --source "BCRA API v4" --query "variable 1187" --outcome "HTTP 200"
          grep -Eq "Serie X,.*,[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}Z" "$WORK/appendix/data_attempts.csv"

      - name: Validator works in isolated mode and requires gate traces
        run: |
          for d in level2-study showcase-hybrid-work; do
            python -I -B skills/heurisma/scripts/validate_report.py examples/$d/report.md \
              --level 2 --html examples/$d/report.html --strict --reproduce
          done
          GATE_WORK="${RUNNER_TEMP:-/tmp}/gate-check"
          rm -rf "$GATE_WORK" && cp -r examples/level2-study "$GATE_WORK" && rm "$GATE_WORK/appendix/gates/qa.md"
          if python -B skills/heurisma/scripts/validate_report.py "$GATE_WORK/report.md" --level 2 --strict; then
            echo "missing appendix/gates/qa.md was not reported"; exit 1
          fi

  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development linters (dev CI only; skill remains zero-dependency)
        run: python -m pip install --upgrade pip && pip install ruff mypy

      - name: Run ruff
        run: ruff check skills/heurisma/scripts tests

      - name: Run mypy
        run: mypy skills/heurisma/scripts
